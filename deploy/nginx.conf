# Production reverse proxy: SPA + API served from the same site (xpressdrive.co.ug),
# so the refresh cookie is first-party SameSite=Strict and CORS stays closed.
server {
    listen 80;
    server_name xpressdrive.co.ug www.xpressdrive.co.ug;
    return 301 https://xpressdrive.co.ug$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name xpressdrive.co.ug;

    ssl_certificate     /etc/letsencrypt/live/xpressdrive.co.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xpressdrive.co.ug/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Basic edge rate limit on auth endpoints (in addition to DRF throttles).
    # Define in http{}: limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/proxy_params_xpressdrive;
    }

    location ~ ^/(api|ops-portal|static)/ {
        include /etc/nginx/proxy_params_xpressdrive;
    }

    # Vue SPA (web/dist)
    root /var/www/xpressdrive/web;
    index index.html;
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

